<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DotBot — Local GGUF Inference</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title">DotBot — Local GGUF Inference</div>
      <div class="controls">
        <label class="btn">
          Upload .gguf
          <input id="modelFile" type="file" accept=".gguf" hidden />
        </label>
        <button id="clearSession" class="btn simple">Clear Session</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <h3>Model Info</h3>
        <div id="modelInfo">No model loaded.</div>
        <div id="loadProgress" class="progress" aria-hidden="true">
          <div id="loadProgressBar" class="progressBar" style="width:0%"></div>
        </div>
        <div id="memoryWarn" class="memoryWarn"></div>
        <h4>Settings</h4>
        <label>Max Tokens: <input id="maxTokens" type="number" value="128" min="1" /></label>
        <label>Temperature: <input id="temperature" type="number" step="0.1" value="0.7" min="0" max="2" /></label>
        <label><input id="useWebGPU" type="checkbox"/> Use WebGPU (if available)</label>
      </aside>

      <section class="chat">
        <div id="dropZone" class="dropzone">Drop .gguf model here or click "Upload"</div>
        <div id="chatLog" class="chatlog"></div>

        <form id="promptForm" class="promptForm">
          <textarea id="prompt" placeholder="Enter prompt..." rows="3"></textarea>
          <div class="formRow">
            <button type="submit" class="btn primary">Send</button>
            <button id="stopBtn" type="button" class="btn simple">Stop</button>
          </div>
        </form>
      </section>
    </main>

    <script src="wasm-loader.js"></script>
    <script src="app.js"></script>
  </body>
  </html>
